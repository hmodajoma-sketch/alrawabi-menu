backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "menu_management"
    label: "إدارة قائمة الطعام (المنيو)"
    files:
      - label: "تعديل الأقسام والأسعار والصور"
        name: "menu_items"
        file: "menu.json"
        fields:
          - label: "أقسام المنيو"
            name: "sections"
            widget: "list"
            fields:
              - label: "اسم القسم"
                name: "section_name"
                widget: "string"
              - label: "الوجبات"
                name: "items"
                widget: "list"
                fields:
                  - label: "اسم الوجبة"
                    name: "name"
                    widget: "string"
                  - label: "السعر"
                    name: "price"
                    widget: "string"
                  - label: "صورة الوجبة"
                    name: "image"
                    widget: "image"
                    required: false
                  - label: "الوصف"
                    name: "description"
                    widget: "text"
                    required: false
