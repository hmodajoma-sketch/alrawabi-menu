<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة طعام مطعم الروابي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .overlay {
            background-color: rgba(18, 18, 18, 0.92);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
        }
        .container { max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo { max-width: 110px; max-height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #ff5722; margin-bottom: 12px; display: none; }
        h1 { color: #ff5722; margin: 0 0 15px 0; font-size: 26px; }
        .contact-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-contact { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; color: white; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn-phone { background-color: #1565c0; }
        .btn-whatsapp { background-color: #2e7d32; }
        .btn-qr { background-color: #ff5722; border: none; cursor: pointer; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e1e; border: 1px solid #444; padding: 25px; border-radius: 12px; text-align: center; max-width: 320px; width: 90%; }
        .modal-content h3 { color: #ff5722; margin-top: 0; }
        #qrcode { background: white; padding: 15px; display: inline-block; border-radius: 8px; margin: 15px 0; }
        .close-modal { background: #c62828; color: white; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; white-space: nowrap; }
        .tab-btn { background: #1e1e1e; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; }
        .tab-btn:hover, .tab-btn.active { background: #ff5722; color: white; border-color: #ff5722; }
        .section-title { color: #ff5722; border-bottom: 2px solid #ff5722; padding-bottom: 5px; margin-top: 35px; margin-bottom: 15px; font-size: 22px; scroll-margin-top: 20px; }
        .menu-item { background: #1e1e1e; border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid #333; }
        .item-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: #2b2b2b; flex-shrink: 0; display: none; }
        .item-details { flex: 1; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .item-name { font-size: 18px; font-weight: bold; color: #fff; }
        .item-price { font-size: 16px; font-weight: bold; color: #4caf50; background: #121212; padding: 4px 10px; border-radius: 6px; border: 1px solid #333; }
        .item-desc { font-size: 14px; color: #aaa; margin: 0; }
        .loading { text-align: center; color: #aaa; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
    <div class="header">
        <img id="siteLogo" class="logo" src="" alt="شعار المطعم">
        <h1 id="siteTitle">مطعم الروابي</h1>
        <div class="contact-buttons">
            <!-- يمكنك تعديل رقم الهاتف ورقم الواتساب من هنا مباشرة -->
            <a href="tel:218920000000" class="btn-contact btn-phone">📞 اتصال هاتفي</a>
            <a href="https://wa.me/218920000000" target="_blank" class="btn-contact btn-whatsapp">💬 واتساب</a>
            <button id="qrBtn" class="btn-contact btn-qr" onclick="openQrModal()">📱 منيو الصالة</button>
        </div>
        <div id="navTabs" class="nav-tabs"></div>
    </div>
    <div id="menuContainer" class="loading">جاري تحميل قائمة الطعام...</div>
</div>

<div id="qrModal" class="modal-overlay" onclick="closeQrModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3>منيو الصالة</h3>
        <p style="font-size: 13px; color: #aaa; margin: 5px 0;">امسح الكود لفتح قائمة الصالة مباشرة</p>
        <div id="qrcode"></div>
        <br>
        <button class="close-modal" onclick="closeQrModal()">إغلاق</button>
    </div>
</div>

<script>
    const owner = "hmodajoma-sketch";
    const repo = "alrawabi-menu";
    const path = "menu.json";
    const branch = "main";

    window.onload = function() {
        fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}?v=` + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('menuContainer');
                const navTabsContainer = document.getElementById('navTabs');
                container.innerHTML = '';
                navTabsContainer.innerHTML = '';

                // عرض الشعار إذا وجد
                if (data.logo) {
                    const logoElem = document.getElementById('siteLogo');
                    logoElem.src = data.logo;
                    logoElem.style.display = 'inline-block';
                }
                
                // عرض الخلفية إذا وجدت
                if (data.background) {
                    document.body.style.backgroundImage = `url('${data.background}')`;
                }

                // إنشاء الباركود لمنيو الصالة
                new QRCode(document.getElementById("qrcode"), {
                    text: "https://alrawabiresturant.ly/hall.html",
                    width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                });

                const sections = data.sections;
                if (!sections || sections.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#aaa;">لا توجد وجبات مضافة حالياً.</p>';
                    return;
                }

                sections.forEach((section, index) => {
                    const sectionId = `sec_${index}`;
                    navTabsContainer.innerHTML += `<a href="#${sectionId}" class="tab-btn">${section.section_name || 'قسم'}</a>`;
                    let sectionHtml = `<div id="${sectionId}" class="section-title">${section.section_name || ''}</div>`;
                    
                    if (section.items && section.items.length > 0) {
                        section.items.forEach(item => {
                            // تفعيل وإظهار صورة الوجبة فور توفرها
                            let imgTag = item.image ? `<img src="${item.image}" class="item-img" style="display: block;" alt="${item.name}">` : '';
                            sectionHtml += `
                                <div class="menu-item">
                                    ${imgTag}
                                    <div class="item-details">
                                        <div class="item-header">
                                            <span class="item-name">${item.name || ''}</span>
                                            <span class="item-price">${item.price || ''}</span>
                                        </div>
                                        <p class="item-desc">${item.description || ''}</p>
                                    </div>
                                </div>
                            `;
                        });
                    }
                    container.innerHTML += sectionHtml;
                });
            })
            .catch(() => {
                document.getElementById('menuContainer').innerHTML = '<p style="color:#ff5722; text-align:center;">تعذر تحميل القائمة حالياً.</p>';
            });
    };

    function openQrModal() { document.getElementById('qrModal').style.display = 'flex'; }
    function closeQrModal() { document.getElementById('qrModal').style.display = 'none'; }
</script>
</body>
</html>
