<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الروابي - Alrawabi Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-red: #e53935;
            --primary-orange: #ff9800;
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 90px;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a, #000000);
            border-bottom: 4px solid var(--primary-red);
            text-align: center;
            padding: 25px 20px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
            background: var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: white;
            box-shadow: 0 4px 15px rgba(229, 57, 53, 0.4);
            border: 2px solid var(--primary-orange);
        }

        header h1 {
            font-size: 26px;
            color: white;
            margin-bottom: 3px;
        }

        header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        .contact-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .contact-btn {
            background: #252525;
            color: var(--primary-orange);
            border: 1px solid var(--primary-orange);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .contact-btn:hover {
            background: var(--primary-orange);
            color: black;
        }

        .categories-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 15px;
            background: #181818;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: #252525;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary-red);
            border-color: var(--primary-orange);
            color: white;
            box-shadow: 0 2px 8px rgba(229, 57, 53, 0.4);
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-title {
            font-size: 22px;
            color: var(--primary-orange);
            margin: 30px 0 15px;
            padding-bottom: 5px;
            border-bottom: 2px dashed var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-grid {
            display: grid;
            gap: 12px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .menu-item:hover {
            border-color: var(--primary-red);
        }

        /* تنسيق صورة الوجبة الجديدة */
        .item-img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
            margin-bottom: 3px;
        }

        .item-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        .item-price {
            background: rgba(229, 57, 53, 0.1);
            color: var(--primary-orange);
            font-size: 16px;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 152, 0, 0.3);
            white-space: nowrap;
        }

        .floating-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(18, 18, 18, 0.95);
            border-top: 2px solid var(--primary-red);
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 2000;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }

        .float-btn {
            background: var(--primary-red);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(229, 57, 53, 0.4);
            transition: transform 0.2s;
        }

        .float-btn.whatsapp {
            background: #25d366;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
        }

        .float-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">الروابي</div>
        <h1>مطعم الروابي</h1>
        <p>Alrawabi Restaurant - أشهى المشويات، الوجبات، والمعجنات</p>
        
        <div class="contact-bar">
            <a href="tel:0921699747" class="contact-btn">📞 0921699747</a>
            <a href="tel:0931800053" class="contact-btn">📞 0931800053</a>
            <a href="tel:0941800053" class="contact-btn">📞 0941800053</a>
        </div>
    </header>

    <div class="categories-nav" id="catNav"></div>

    <div class="container" id="menuContainer"></div>

    <div class="floating-footer">
        <a href="tel:0921699747" class="float-btn">📞 اتصل للطلب</a>
        <a href="https://wa.me/218921699747" target="_blank" class="float-btn whatsapp">💬 اطلب عبر واتساب</a>
    </div>

    <script>
        const catNav = document.getElementById('catNav');
        const menuContainer = document.getElementById('menuContainer');

        async function loadMenu() {
            try {
                const response = await fetch('menu.json');
                const data = await response.json();
                
                if (data && data.sections) {
                    renderMenu(data.sections);
                }
            } catch (error) {
                console.error('Error loading menu data:', error);
            }
        }

        function renderMenu(sections) {
            catNav.innerHTML = '';
            menuContainer.innerHTML = '';

            sections.forEach((section, index) => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = section.section_name;
                btn.onclick = () => {
                    document.getElementById(`sec-${index}`).scrollIntoView({ behavior: 'smooth' });
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                catNav.appendChild(btn);

                const sectionDiv = document.createElement('div');
                sectionDiv.id = `sec-${index}`;
                sectionDiv.innerHTML = `
                    <h2 class="section-title">🔥 ${section.section_name}</h2>
                    <div class="menu-grid">
                        ${section.items.map(item => `
                            <div class="menu-item">
                                ${item.image ? `<img src="${item.image}" alt="${item.name}" class="item-img">` : ''}
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
                                </div>
                                <div class="item-price">${item.price}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                menuContainer.appendChild(sectionDiv);
            });
        }

        loadMenu();
    </script>
</body>
</html>
