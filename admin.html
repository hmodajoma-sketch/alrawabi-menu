<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مطعم الروابي</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #121212; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1, h2, h3 { color: #ff5722; text-align: center; }
        .token-box { background: #2b2b2b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        .token-box input { width: 100%; padding: 10px; background: #121212; border: 1px solid #555; color: white; border-radius: 6px; box-sizing: border-box; margin-top: 5px; }
        .section-box { background: #252525; border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .item-box { background: #2e2e2e; border: 1px solid #555; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        input[type="text"], input[type="file"] { padding: 8px; background: #121212; border: 1px solid #444; color: white; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        button { background: #ff5722; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:hover { background: #e64a19; }
        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-success { background: #2e7d32; width: 100%; font-size: 16px; padding: 15px; margin-top: 20px; }
        .btn-success:hover { background: #1b5e20; }
        .preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #555; display: inline-block; vertical-align: middle; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; color: white; font-size: 20px; flex-direction: column; gap: 15px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ff5722; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <span id="loadingText">جاري حفظ التغييرات ونشر الصور...</span>
</div>

<div class="container">
    <h1>لوحة تحكم مطعم الروابي</h1>
    
    <div class="token-box">
        <label for="githubToken"><strong>رمز صلاحية GitHub (GitHub Personal Access Token):</strong></label>
        <p style="font-size: 12px; color: #aaa; margin: 5px 0;">يُطلب مرة واحدة فقط لتمكين لوحة التحكم من رفع الصور وحفظ الملفات على مستودعك.</p>
        <input type="password" id="githubToken" placeholder="أدخل رمز الـ Token هنا (ghp_...)">
    </div>

    <div id="editorContainer">
        <p style="text-align: center; color: #aaa;">جاري تحميل القائمة...</p>
    </div>

    <button class="btn btn-success" onclick="saveMenu()">💾 حفظ التغييرات ونشرها على الموقع</button>
</div>

<script>
    const owner = "hmodajoma-sketch";
    const repo = "alrawabi-menu";
    const branch = "main";
    let menuData = null;

    window.onload = function() {
        const savedToken = localStorage.getItem("github_token_rawabi");
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
        }
        loadMenuData();
    };

    function loadMenuData() {
        fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/menu.json?v=` + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                menuData = data;
                renderEditor();
            })
            .catch(() => {
                alert("تعذر تحميل بيانات القائمة من GitHub.");
            });
    }

    function renderEditor() {
        const container = document.getElementById('editorContainer');
        container.innerHTML = '';

        if (!menuData.sections) menuData.sections = [];

        menuData.sections.forEach((section, sIndex) => {
            let sBox = document.createElement('div');
            sBox.className = 'section-box';
            
            let itemsHtml = '';
            if (section.items) {
                section.items.forEach((item, iIndex) => {
                    itemsHtml += `
                        <div class="item-box">
                            <div class="row">
                                <input type="text" placeholder="اسم الوجبة" value="${item.name || ''}" oninput="updateItem(${sIndex}, ${iIndex}, 'name', this.value)">
                                <input type="text" placeholder="السعر" value="${item.price || ''}" style="max-width: 120px;" oninput="updateItem(${sIndex}, ${iIndex}, 'price', this.value)">
                            </div>
                            <input type="text" placeholder="الوصف (مثال: 3 أسياخ - رز - بطاطا)" value="${item.description || ''}" oninput="updateItem(${sIndex}, ${iIndex}, 'description', this.value)">
                            <div class="row" style="align-items: center;">
                                <input type="file" accept="image/*" id="file_${sIndex}_${iIndex}" onchange="prepareImageUpload(${sIndex}, ${iIndex}, this)">
                                ${item.image ? `<img src="${item.image}" class="preview-img">` : '<span style="font-size:12px; color:#777;">بدون صورة</span>'}
                                <button class="btn-danger" style="padding: 6px 12px;" onclick="deleteItem(${sIndex}, ${iIndex})">حذف الوجبة</button>
                            </div>
                        </div>
                    `;
                });
            }

            sBox.innerHTML = `
                <h3>قسم: <input type="text" value="${section.section_name || ''}" style="width: 60%; display:inline-block;" oninput="updateSectionName(${sIndex}, this.value)"></h3>
                <div id="items_${sIndex}">${itemsHtml}</div>
                <button onclick="addItem(${sIndex})">➕ إضافة وجبة جديدة لهذا القسم</button>
                <button class="btn-danger" style="float: left;" onclick="deleteSection(${sIndex})">حذف القسم بالكامل</button>
                <div style="clear: both;"></div>
            `;
            container.appendChild(sBox);
        });

        let addSecBtn = document.createElement('button');
        addSecBtn.className = "btn";
        addSecBtn.style.background = "#1565c0";
        addSecBtn.style.width = "100%";
        addSecBtn.style.marginTop = "10px";
        addSecBtn.innerText = "➕ إضافة قسم جديد";
        addSecBtn.onclick = addSection;
        container.appendChild(addSecBtn);
    }

    function updateSectionName(sIndex, val) { menuData.sections[sIndex].section_name = val; }
    function updateItem(sIndex, iIndex, field, val) { menuData.sections[sIndex].items[iIndex][field] = val; }
    
    function deleteItem(sIndex, iIndex) {
        menuData.sections[sIndex].items.splice(iIndex, 1);
        renderEditor();
    }
    
    function addItem(sIndex) {
        if (!menuData.sections[sIndex].items) menuData.sections[sIndex].items = [];
        menuData.sections[sIndex].items.push({ name: "", description: "", price: "", image: "" });
        renderEditor();
    }

    function deleteSection(sIndex) {
        if(confirm("هل أنت متأكد من حذف هذا القسم بالكامل؟")) {
            menuData.sections.splice(sIndex, 1);
            renderEditor();
        }
    }

    function addSection() {
        menuData.sections.push({ section_name: "قسم جديد", items: [] });
        renderEditor();
    }

    // تخزين الملف المؤقت للرفع عند الحفظ
    let pendingImages = {}; 
    function prepareImageUpload(sIndex, iIndex, input) {
        if (input.files && input.files[0]) {
            pendingImages[`${sIndex}_${iIndex}`] = input.files[0];
            alert("تم اختيار الصورة بنجاح. سيتم رفعها تلقائياً عند الضغط على زر حفظ التغييرات.");
        }
    }

    async function uploadImageToGitHub(file, token) {
        const reader = new FileReader();
        return new Promise((resolve, reject) => {
            reader.onload = async function(e) {
                const base64Content = e.target.result.split(',')[1];
                const fileName = `images/img_${Date.now()}_${Math.floor(Math.random() * 1000)}.jpg`;
                
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${fileName}`;
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload image ${fileName}`,
                        content: base64Content,
                        branch: branch
                    })
                });

                if (response.ok) {
                    const resData = await response.json();
                    resolve(resData.content.download_url);
                } else {
                    reject("فشل رفع إحدى الصور إلى GitHub.");
                }
            };
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    async function saveMenu() {
        const token = document.getElementById('githubToken').value.trim();
        if (!token) {
            alert("يرجى إدخال رمز صلاحية GitHub (Token) لحفظ التعديلات ورفع الصور.");
            return;
        }
        localStorage.setItem("github_token_rawabi", token);

        const overlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        overlay.style.display = 'flex';

        try {
            // 1. رفع الصور المعلقة إلى مجلد images في GitHub أولاً
            for (let key in pendingImages) {
                loadingText.innerText = `جاري رفع الصور الجديدة... (${Object.keys(pendingImages).indexOf(key) + 1}/${Object.keys(pendingImages).length})`;
                const [sIndex, iIndex] = key.split('_');
                const file = pendingImages[key];
                const imageUrl = await uploadImageToGitHub(file, token);
                menuData.sections[sIndex].items[iIndex].image = imageUrl;
            }
            pendingImages = {}; // تفريغ القائمة المؤقتة بعد الرفع

            // 2. تحديث قائمة الصالة hall_sections لتتطابق تلقائياً مع التوصيل
            menuData.hall_sections = JSON.parse(JSON.stringify(menuData.sections));

            // 3. رفع ملف menu.json المحدث
            loadingText.innerText = "جاري حفظ ملف القائمة وتحديث الموقع...";
            const jsonPath = "menu.json";
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${jsonPath}`;

            // جلب الـ SHA الحالي للملف لتجنب أخطاء التعارض
            const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
            const fileData = await getRes.json();
            const sha = fileData.sha;

            const jsonString = JSON.stringify(menuData, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Update menu and images via admin panel",
                    content: encodedContent,
                    sha: sha,
                    branch: branch
                })
            });

            overlay.style.display = 'none';

            if (putRes.ok) {
                alert("✨ تم حفظ التغييرات ورفع الصور ونشر الموقع بنجاح تام!");
                loadMenuData();
            } else {
                const errJson = await putRes.json();
                alert("حدث خطأ أثناء حفظ الملف: " + (errJson.message || "تأكد من صلاحيات الـ Token"));
            }

        } catch (error) {
            overlay.style.display = 'none';
            alert("خطأ: " + error);
        }
    }
</script>
</body>
</html>
