<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مطعم الروابي</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #121212; color: #f0f0f0; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        h1, h2 { color: #ff5722; text-align: center; }
        .section-box { background: #2b2b2b; border: 1px solid #444; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #121212; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; }
        .btn-primary { background: #ff5722; color: white; width: 100%; font-size: 16px; padding: 15px; margin-top: 20px; }
        .btn-add { background: #2e7d32; color: white; margin: 5px 0; }
        .btn-danger { background: #c62828; color: white; }
        .item-row { background: #181818; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #333; }
        .tab-switcher { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-menu-btn { background: #333; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .tab-menu-btn.active { background: #ff5722; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة التحكم الشاملة</h1>
    
    <div class="tab-switcher">
        <button class="tab-menu-btn active" onclick="switchTab('main')">المنيو الرئيسي (التوصيل)</button>
        <button class="tab-menu-btn" onclick="switchTab('hall')">منيو الصالة</button>
    </div>

    <!-- قسم إعدادات عامة -->
    <div class="section-box">
        <h3>الإعدادات العامة</h3>
        <label>رابط الشعار:</label>
        <input type="text" id="logoInput" placeholder="/images/logo.png">
        <label>رابط الخلفية:</label>
        <input type="text" id="bgInput" placeholder="/images/bg.jpg">
    </div>

    <!-- محرر المنيو الرئيسي -->
    <div id="mainMenuEditor" class="menu-editor-section">
        <h2>أقسام المنيو الرئيسي</h2>
        <div id="sectionsContainer"></div>
        <button class="btn-add" onclick="addSection('main')">+ إضافة قسم جديد للرئيسي</button>
    </div>

    <!-- محرر منيو الصالة -->
    <div id="hallMenuEditor" class="menu-editor-section" style="display: none;">
        <h2>أقسام منيو الصالة</h2>
        <div id="hallSectionsContainer"></div>
        <button class="btn-add" onclick="addSection('hall')">+ إضافة قسم جديد للصالة</button>
    </div>

    <button class="btn-primary" onclick="saveData()">حفظ التغييرات ونشرها على الموقع</button>
    <p id="statusMsg" style="text-align: center; margin-top: 15px;"></p>
</div>

<script>
    const owner = "hmodajoma-sketch";
    const repo = "alrawabi-menu";
    const path = "menu.json";
    const branch = "main";
    let githubToken = prompt("أدخل رمز الصلاحية (GitHub Token) الخاص بك لتفعيل الحفظ:");

    let menuData = { logo: "", background: "", sections: [], hall_sections: [] };

    window.onload = function() {
        fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}?v=` + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                menuData = data;
                if(!menuData.hall_sections) menuData.hall_sections = [];
                document.getElementById('logoInput').value = menuData.logo || "";
                document.getElementById('bgInput').value = menuData.background || "";
                renderSections('main');
                renderSections('hall');
            })
            .catch(() => alert("تعذر جلب ملف menu.json"));
    };

    function switchTab(type) {
        document.querySelectorAll('.tab-menu-btn').forEach(b => b.classList.remove('active'));
        if(type === 'main') {
            document.querySelectorAll('.tab-menu-btn')[0].classList.add('active');
            document.getElementById('mainMenuEditor').style.display = 'block';
            document.getElementById('hallMenuEditor').style.display = 'none';
        } else {
            document.querySelectorAll('.tab-menu-btn')[1].classList.add('active');
            document.getElementById('mainMenuEditor').style.display = 'none';
            document.getElementById('hallMenuEditor').style.display = 'block';
        }
    }

    function renderSections(type) {
        const containerId = type === 'main' ? 'sectionsContainer' : 'hallSectionsContainer';
        const targetSections = type === 'main' ? menuData.sections : menuData.hall_sections;
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        targetSections.forEach((sec, sIdx) => {
            let itemsHtml = '';
            if(sec.items) {
                sec.items.forEach((item, iIdx) => {
                    itemsHtml += `
                        <div class="item-row">
                            <input type="text" placeholder="اسم الوجبة" value="${item.name || ''}" onchange="updateItem('${type}', ${sIdx}, ${iIdx}, 'name', this.value)">
                            <input type="text" placeholder="السعر" value="${item.price || ''}" onchange="updateItem('${type}', ${sIdx}, ${iIdx}, 'price', this.value)">
                            <input type="text" placeholder="الوصف" value="${item.description || ''}" onchange="updateItem('${type}', ${sIdx}, ${iIdx}, 'description', this.value)">
                            <input type="text" placeholder="رابط الصورة" value="${item.image || ''}" onchange="updateItem('${type}', ${sIdx}, ${iIdx}, 'image', this.value)">
                            <button class="btn-danger" onclick="deleteItem('${type}', ${sIdx}, ${iIdx})">حذف الوجبة</button>
                        </div>
                    `;
                });
            }

            container.innerHTML += `
                <div class="section-box">
                    <label><b>اسم القسم:</b></label>
                    <input type="text" value="${sec.section_name || ''}" onchange="updateSectionName('${type}', ${sIdx}, this.value)">
                    <button class="btn-danger" onclick="deleteSection('${type}', ${sIdx})">حذف القسم بالكامل</button>
                    <h4>الوجبات في هذا القسم:</h4>
                    ${itemsHtml}
                    <button class="btn-add" onclick="addItem('${type}', ${sIdx})">+ إضافة وجبة جديدة</button>
                </div>
            `;
        });
    }

    function updateSectionName(type, sIdx, val) {
        if(type === 'main') menuData.sections[sIdx].section_name = val;
        else menuData.hall_sections[sIdx].section_name = val;
    }
    function updateItem(type, sIdx, iIdx, field, val) {
        if(type === 'main') menuData.sections[sIdx].items[iIdx][field] = val;
        else menuData.hall_sections[sIdx].items[iIdx][field] = val;
    }
    function addSection(type) {
        if(type === 'main') menuData.sections.push({ section_name: "قسم جديد", items: [] });
        else menuData.hall_sections.push({ section_name: "قسم صالة جديد", items: [] });
        renderSections(type);
    }
    function deleteSection(type, sIdx) {
        if(type === 'main') menuData.sections.splice(sIdx, 1);
        else menuData.hall_sections.splice(sIdx, 1);
        renderSections(type);
    }
    function addItem(type, sIdx) {
        const newItem = { name: "", price: "", description: "", image: "" };
        if(type === 'main') menuData.sections[sIdx].items.push(newItem);
        else menuData.hall_sections[sIdx].items.push(newItem);
        renderSections(type);
    }
    function deleteItem(type, sIdx, iIdx) {
        if(type === 'main') menuData.sections[sIdx].items.splice(iIdx, 1);
        else menuData.hall_sections[sIdx].items.splice(iIdx, 1);
        renderSections(type);
    }

    async function saveData() {
        if (!githubToken) {
            githubToken = prompt("الرجاء إدخال GitHub Token للحفظ:");
            if (!githubToken) return;
        }
        menuData.logo = document.getElementById('logoInput').value;
        menuData.background = document.getElementById('bgInput').value;

        document.getElementById('statusMsg').innerText = "جاري الحفظ ونشر التعديلات...";

        // جلب الـ SHA الحالي للملف
        let sha = "";
        let getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
            headers: { "Authorization": `token ${githubToken}` }
        });
        if(getRes.ok) {
            let fileData = await getRes.json();
            sha = fileData.sha;
        }

        // رفع الملف المحدث
        let contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(menuData, null, 4))));
        let putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
            method: "PUT",
            headers: {
                "Authorization": `token ${githubToken}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "Update menu via admin panel",
                content: contentEncoded,
                sha: sha,
                branch: branch
            })
        });

        if(putRes.ok) {
            document.getElementById('statusMsg').style.color = "#4caf50";
            document.getElementById('statusMsg').innerText = "تم حفظ وتحديث الموقع بنجاح!";
        } else {
            document.getElementById('statusMsg').style.color = "#ff5722";
            document.getElementById('statusMsg').innerText = "فشل الحفظ! تأكد من صلاحية التوكن (Token).";
        }
    }
</script>

</body>
</html>
